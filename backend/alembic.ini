[alembic]
script_location = alembic
# sqlalchemy.url is intentionally left unset here. Alembic must receive
# DATABASE_URL explicitly from the environment (see backend/alembic/env.py) -
# no hardcoded host/port fallback is used, because the correct value
# differs between Full Docker (db:5432) and Hybrid development
# (127.0.0.1:5433). See backend/.env.example.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S