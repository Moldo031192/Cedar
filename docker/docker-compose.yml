version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: cedar-db
    environment:
      POSTGRES_USER: cedar
      POSTGRES_PASSWORD: cedar
      POSTGRES_DB: cedar
    ports:
      - "5432:5432"
    volumes:
      - cedar_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
    container_name: cedar-backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ../frontend
    container_name: cedar-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  cedar_db_data:
